[package]
name = "waylaw"
description = "A project launcher in Rust"
version = "0.1.0"
edition = "2024"
authors = ["Duck <dragonfff159@gmail.com>"]
repository = "https://github.com/DuckCosmos/waylaw"
license = "GPL-3.0-only"

[profile.dev]
debug = "line-tables-only"

[profile.dev.package."*"]
opt-level = 2

[dependencies]
glib = "0.21"
gtk4 = { version = "0.11.5", features = ["v4_20"] }
gtk4-layer-shell = "0.8.1"
meval = "0.2"
